name: "Deploy Medical Project"

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.5"

jobs:

  # ── Job 1 : verifier si une VM existe deja ──────────────────────────────
  check:
    name: "Job 1 - Check VM existante"
    runs-on: ubuntu-latest
    outputs:
      vm_exists: ${{ steps.check_vm.outputs.vm_exists }}
      server_ip: ${{ steps.check_vm.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier si la VM existe et repond
        id: check_vm
        run: |
          SERVER_IP=""
          if [ -f terraform/terraform.tfstate ]; then
            SERVER_IP=$(jq -r '[.resources[] | select(.type=="aws_eip") | .instances[0].attributes.public_ip // ""] | first // ""' terraform/terraform.tfstate 2>/dev/null || echo "")
          fi

          if [ -n "$SERVER_IP" ] && [ "$SERVER_IP" != "null" ]; then
            echo "IP trouvee dans tfstate : $SERVER_IP"
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
            chmod 600 ~/.ssh/labsuser.pem
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "vm_exists=true"       >> "$GITHUB_OUTPUT"
              echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Aucune VM active trouvee"
          echo "vm_exists=false" >> "$GITHUB_OUTPUT"
          echo "server_ip="      >> "$GITHUB_OUTPUT"

  # ── Job 2 : provisionner EC2 via Terraform ──────────────────────────────
  terraform:
    name: "Job 2 - Provision EC2"
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.vm_exists != 'true'
    outputs:
      server_ip: ${{ steps.tf_output.outputs.server_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Importer ressources AWS existantes
        working-directory: ./terraform
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=medical-app-sg" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")
          if [ "$SG_ID" != "None" ] && [ "$SG_ID" != "null" ] && [ -n "$SG_ID" ]; then
            terraform import aws_security_group.medical_sg "$SG_ID" 2>/dev/null || true
          fi

          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=medical-app-server" "Name=instance-state-name,Values=running,stopped" --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || echo "None")
          if [ "$INSTANCE_ID" != "None" ] && [ "$INSTANCE_ID" != "null" ] && [ -n "$INSTANCE_ID" ]; then
            terraform import aws_instance.medical_app "$INSTANCE_ID" 2>/dev/null || true
          fi

          EIP_ALLOC=$(aws ec2 describe-addresses --filters "Name=tag:Name,Values=medical-app-eip" --query "Addresses[0].AllocationId" --output text 2>/dev/null || echo "None")
          if [ "$EIP_ALLOC" != "None" ] && [ "$EIP_ALLOC" != "null" ] && [ -n "$EIP_ALLOC" ]; then
            terraform import aws_eip.medical_eip "$EIP_ALLOC" 2>/dev/null || true
          fi

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -var="db_app_password=${{ secrets.DB_APP_PASSWORD }}" -var="mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }}" -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Recuperer Elastic IP
        id: tf_output
        working-directory: ./terraform
        run: |
          SERVER_IP=$(terraform output -raw elastic_ip)
          echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
          echo "Nouvelle VM : $SERVER_IP"

      - name: Sauvegarder Terraform State
        if: always()
        working-directory: ./terraform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git stash -- terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git pull --rebase origin main || true
          git stash pop 2>/dev/null || true
          git add terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update terraform state [skip ci]"
          git push || echo "Push state echoue"

  # ── Job 3 : deployer l'application ──────────────────────────────────────
  setup:
    name: "Job 3 - Deploy Application"
    runs-on: ubuntu-latest
    needs: [check, terraform]
    if: >
      always() &&
      needs.check.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determiner IP du serveur
        id: get_ip
        run: |
          if [ "${{ needs.check.outputs.vm_exists }}" == "true" ]; then
            echo "server_ip=${{ needs.check.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_ip=${{ needs.terraform.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Attendre SSH
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo "Attente SSH sur $SERVER_IP..."
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "SSH pret apres $((i * 10))s"
              break
            fi
            echo "  Tentative $i/40..."
            sleep 10
          done

      - name: Copier le script setup
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem scripts/setup.sh ubuntu@"$SERVER_IP":/tmp/setup.sh

      - name: Executer le setup
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
          VM_EXISTS: ${{ needs.check.outputs.vm_exists }}
          ELASTIC_IP: ${{ steps.get_ip.outputs.server_ip }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "chmod +x /tmp/setup.sh && sudo VM_EXISTS='$VM_EXISTS' ELASTIC_IP='$ELASTIC_IP' DB_APP_PASSWORD='$DB_APP_PASSWORD' MYSQL_ROOT_PASSWORD='$MYSQL_ROOT_PASSWORD' bash /tmp/setup.sh"

  # ── Job 4 : demarrer les services ───────────────────────────────────────
  run:
    name: "Job 4 - Start Services"
    runs-on: ubuntu-latest
    needs: [check, terraform, setup]
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Determiner IP du serveur
        id: get_ip
        run: |
          if [ "${{ needs.check.outputs.vm_exists }}" == "true" ]; then
            echo "server_ip=${{ needs.check.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_ip=${{ needs.terraform.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Ecrire le script de demarrage
        env:
          REMOTE_SCRIPT: |
            #!/bin/bash
            set -e
            echo "=== MySQL ==="
            sudo systemctl is-active mysql || sudo systemctl start mysql
            sleep 2
            echo "=== Liberation port 8000 ==="
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sudo systemctl stop medical-backend 2>/dev/null || true
            sleep 2
            echo "=== Verification venv ==="
            if [ ! -f /opt/backend/venv/bin/python ]; then
              sudo rm -rf /opt/backend/venv
              sudo python3 -m venv /opt/backend/venv
              sudo /opt/backend/venv/bin/pip install -r /opt/backend/requirements.txt -q
              sudo chown -R ubuntu:ubuntu /opt/backend/venv
            fi
            echo "=== Lancement Django runserver ==="
            cd /opt/backend
            source /opt/backend/venv/bin/activate
            nohup python manage.py runserver 0.0.0.0:8000 > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid
            deactivate
            echo "Backend PID $(cat /tmp/backend.pid)"
            echo "=== nginx ==="
            sudo systemctl is-active nginx || sudo systemctl start nginx
            sleep 8
            echo "=== Endpoints ==="
            curl -s -o /dev/null -w "Frontend :80   HTTP %{http_code}\n" http://localhost/ || true
            curl -s -o /dev/null -w "Backend  :8000 HTTP %{http_code}\n" http://localhost:8000/api/ || true
            echo "=== Logs backend ==="
            tail -5 /tmp/backend.log || true
        run: printf '%s' "$REMOTE_SCRIPT" > /tmp/start_services.sh

      - name: Copier et executer le script de demarrage
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem /tmp/start_services.sh ubuntu@"$SERVER_IP":/tmp/start_services.sh
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "chmod +x /tmp/start_services.sh && sudo bash /tmp/start_services.sh"

      - name: Afficher les URLs
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo ""
          echo "=========================================="
          echo "  PROJET MEDICAL - DEPLOYE AVEC SUCCES"
          echo "=========================================="
          echo "  Frontend : http://$SERVER_IP"
          echo "  Backend  : http://$SERVER_IP:8000"
          echo "  API      : http://$SERVER_IP/api/"
          echo "  SSH      : ssh -i labsuser.pem ubuntu@$SERVER_IP"
          echo "=========================================="
