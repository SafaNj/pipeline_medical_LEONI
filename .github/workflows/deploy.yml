name: "Deploy Medical Project"

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.5"

# ──────────────────────────────────────────────────────────────────────────────
# Secrets GitHub Actions requis (Settings → Secrets → Actions) :
#   AWS_ACCESS_KEY_ID       – identifiant AWS
#   AWS_SECRET_ACCESS_KEY   – cle secrete AWS
#   AWS_SESSION_TOKEN       – token de session (AWS Academy)
#   SSH_PRIVATE_KEY         – contenu complet de labsuser.pem
#   DB_APP_PASSWORD         – mot de passe MySQL pour medical_user
#   MYSQL_ROOT_PASSWORD     – mot de passe MySQL root
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  check:
    name: "Job 1 — Verification VM existante"
    runs-on: ubuntu-latest
    outputs:
      vm_exists: ${{ steps.check_vm.outputs.vm_exists }}
      server_ip: ${{ steps.check_vm.outputs.server_ip }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Verifier si la VM existe et repond
        id: check_vm
        run: |
          SERVER_IP=""
          if [ -f terraform/terraform.tfstate ]; then
            SERVER_IP=$(python3 - <<'PY'
import json, sys
try:
    with open("terraform/terraform.tfstate") as f:
        s = json.load(f)
    for r in s.get("resources", []):
        if r.get("type") == "aws_eip":
            for i in r.get("instances", []):
                ip = i.get("attributes", {}).get("public_ip", "")
                if ip:
                    print(ip)
                    sys.exit(0)
except Exception:
    pass
PY
            )
          fi

          if [ -n "$SERVER_IP" ]; then
            echo "IP trouvee dans tfstate : $SERVER_IP"
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
            chmod 600 ~/.ssh/labsuser.pem
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes \
               -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "VM existante et accessible : $SERVER_IP"
              echo "vm_exists=true"  >> "$GITHUB_OUTPUT"
              echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Aucune VM active trouvee"
          echo "vm_exists=false" >> "$GITHUB_OUTPUT"
          echo "server_ip="      >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  terraform:
    name: "Job 2 — Provisionnement EC2 via Terraform"
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.vm_exists != 'true'
    outputs:
      server_ip: ${{ steps.tf_output.outputs.server_ip }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Installer Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Importer ressources AWS existantes (si elles existent)
        working-directory: ./terraform
        run: |
          echo "Recherche de ressources existantes sur AWS..."

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=medical-app-sg" \
            --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")
          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ] && [ "$SG_ID" != "null" ]; then
            echo "Security Group : $SG_ID — import..."
            terraform import aws_security_group.medical_sg "$SG_ID" 2>/dev/null || echo "Deja dans le state"
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medical-app-server" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || echo "None")
          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "null" ]; then
            echo "Instance EC2 : $INSTANCE_ID — import..."
            terraform import aws_instance.medical_app "$INSTANCE_ID" 2>/dev/null || echo "Deja dans le state"
          fi

          EIP_ALLOC=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=medical-app-eip" \
            --query "Addresses[0].AllocationId" --output text 2>/dev/null || echo "None")
          if [ "$EIP_ALLOC" != "None" ] && [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "null" ]; then
            echo "Elastic IP : $EIP_ALLOC — import..."
            terraform import aws_eip.medical_eip "$EIP_ALLOC" 2>/dev/null || echo "Deja dans le state"
          fi

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="db_app_password=${{ secrets.DB_APP_PASSWORD }}" \
            -var="mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Recuperer l'IP publique (Elastic IP)
        id: tf_output
        working-directory: ./terraform
        run: |
          SERVER_IP=$(terraform output -raw elastic_ip)
          echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
          echo "Nouvelle VM creee : $SERVER_IP"

      - name: Sauvegarder Terraform State dans le repo
        if: always()
        working-directory: ./terraform
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git stash -- terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git pull --rebase origin main || true
          git stash pop 2>/dev/null || true
          git add terraform.tfstate terraform.tfstate.backup 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore: update terraform state [skip ci]"
          git push || echo "Push du state echoue (non bloquant)"

  # ────────────────────────────────────────────────────────────────────────────
  setup:
    name: "Job 3 — Deploiement de l'application"
    runs-on: ubuntu-latest
    needs: [check, terraform]
    if: >
      always() &&
      needs.check.result == 'success' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Determiner l'IP du serveur
        id: get_ip
        run: |
          if [ "${{ needs.check.outputs.vm_exists }}" == "true" ]; then
            echo "server_ip=${{ needs.check.outputs.server_ip }}"  >> "$GITHUB_OUTPUT"
            echo "Reutilisation VM existante : ${{ needs.check.outputs.server_ip }}"
          else
            echo "server_ip=${{ needs.terraform.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
            echo "Nouvelle VM : ${{ needs.terraform.outputs.server_ip }}"
          fi

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Attendre que la VM soit prete (SSH)
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo "Attente SSH sur $SERVER_IP..."
          for i in $(seq 1 40); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
               -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" "echo ok" 2>/dev/null; then
              echo "SSH pret apres $((i * 10))s"
              break
            fi
            echo "  Tentative $i/40 — attente 10s..."
            sleep 10
          done

      - name: Copier le script de deploiement sur la VM
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem \
            scripts/setup.sh ubuntu@"$SERVER_IP":/tmp/setup.sh

      - name: Executer le deploiement sur la VM
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
          VM_EXISTS:          ${{ needs.check.outputs.vm_exists }}
          ELASTIC_IP:         ${{ steps.get_ip.outputs.server_ip }}
          DB_APP_PASSWORD:    ${{ secrets.DB_APP_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" \
            "chmod +x /tmp/setup.sh && \
             sudo VM_EXISTS='$VM_EXISTS' \
                  ELASTIC_IP='$ELASTIC_IP' \
                  DB_APP_PASSWORD='$DB_APP_PASSWORD' \
                  MYSQL_ROOT_PASSWORD='$MYSQL_ROOT_PASSWORD' \
                  bash /tmp/setup.sh"

  # ────────────────────────────────────────────────────────────────────────────
  run:
    name: "Job 4 — Demarrage des services et affichage URLs"
    runs-on: ubuntu-latest
    needs: [check, terraform, setup]
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Determiner l'IP du serveur
        id: get_ip
        run: |
          if [ "${{ needs.check.outputs.vm_exists }}" == "true" ]; then
            echo "server_ip=${{ needs.check.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          else
            echo "server_ip=${{ needs.terraform.outputs.server_ip }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/labsuser.pem
          chmod 600 ~/.ssh/labsuser.pem

      - name: Demarrer backend et verifier les services
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/labsuser.pem ubuntu@"$SERVER_IP" << 'REMOTE'
            set -e
            echo "=== Demarrage des services ==="

            # MySQL
            sudo systemctl is-active mysql || sudo systemctl start mysql
            sleep 2

            # Arreter tout ce qui tourne sur le port 8000 (gunicorn ou runserver)
            echo "Liberation du port 8000..."
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sudo systemctl stop medical-backend 2>/dev/null || true
            sleep 2

            # Recreer le venv si absent ou corrompu
            if [ ! -f /opt/backend/venv/bin/python ]; then
              echo "Venv absent — recreation..."
              sudo rm -rf /opt/backend/venv
              sudo python3 -m venv /opt/backend/venv
              sudo /opt/backend/venv/bin/pip install -r /opt/backend/requirements.txt -q
              sudo chown -R ubuntu:ubuntu /opt/backend/venv
            fi

            # Lancer Django runserver en arriere-plan
            echo "Lancement de Django runserver sur :8000..."
            source /opt/backend/venv/bin/activate
            cd /opt/backend
            nohup python manage.py runserver 0.0.0.0:8000 \
              > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid
            echo "Backend PID : $(cat /tmp/backend.pid)"
            deactivate

            # nginx (sert le frontend build)
            sudo systemctl is-active nginx || sudo systemctl start nginx

            sleep 8

            echo ""
            echo "=== Verification des endpoints ==="
            curl -s -o /dev/null -w "Backend  (port 8000) : HTTP %{http_code}\n" \
              http://localhost:8000/api/ || echo "Backend  : en cours de demarrage..."
            curl -s -o /dev/null -w "Frontend (port 80)   : HTTP %{http_code}\n" \
              http://localhost/         || echo "Frontend : en cours de demarrage..."

            echo ""
            echo "=== Logs backend (10 dernieres lignes) ==="
            tail -10 /tmp/backend.log || true
          REMOTE

      - name: Afficher les URLs de l'application
        env:
          SERVER_IP: ${{ steps.get_ip.outputs.server_ip }}
        run: |
          echo ""
          echo "============================================="
          echo "   PROJET MEDICAL — DEPLOYE AVEC SUCCES"
          echo "============================================="
          echo ""
          echo "  Frontend  : http://$SERVER_IP"
          echo "  Backend   : http://$SERVER_IP:8000"
          echo "  API       : http://$SERVER_IP/api/"
          echo "  Vite dev  : http://$SERVER_IP:5173  (si vite en mode dev)"
          echo "  API proxy : http://$SERVER_IP/api/  (via nginx)"
          echo ""
          echo "  SSH       : ssh -i labsuser.pem ubuntu@$SERVER_IP"
          echo "  Logs boot : sudo tail -f /var/log/medical-bootstrap.log"
          echo "  Logs app  : sudo journalctl -u medical-backend -f"
          echo ""
          echo "  Secrets GitHub Actions requis :"
          echo "    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN"
          echo "    SSH_PRIVATE_KEY (contenu de labsuser.pem)"
          echo "    DB_APP_PASSWORD, MYSQL_ROOT_PASSWORD"
          echo "============================================="
